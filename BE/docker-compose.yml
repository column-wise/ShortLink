version: "3.9"
name: short-link

services:
  mysql:
    image: mysql:8.0
    container_name: shortlink-mysql
    env_file:
      - dev.env
    ports:
      - "3306:3306"
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u$${MYSQL_ROOT_USER:-root}", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: shortlink-redis
    env_file:
      - dev.env
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    container_name: shortlink-api
    env_file:
      - dev.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  batch-server:
    build:
      context: .
      dockerfile: batch-server/Dockerfile
    container_name: shortlink-batch
    env_file:
      - dev.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
