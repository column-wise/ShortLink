spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:shortlink}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:shortlink}
    password: ${MYSQL_PASSWORD:shortlink}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: 1
      retries: 5
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: false
        max.in.flight.requests.per.connection: 8
      linger-ms: 10
      batch-size: 32768
      compression-type: zstd

server:
  url: ${SERVER_URL:http://localhost:8080}
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    io.github.columnwise.shortlink: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.kafka: DEBUG

app:
  kafka:
    topics:
      linkHits: ${APP_KAFKA_TOPICS_LINKHITS:link_hits}
